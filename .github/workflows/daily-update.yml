name: 野球データ自動更新

on:
  schedule:
    # UTC 14:30 = 日本時間 23:30（その日の試合が出そろった頃）
    - cron: '30 14 * * *'
  workflow_dispatch:  # Actionsタブから手動実行もできるようにする

permissions:
  contents: write  # git push するために必要

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 対象日付を計算（日本時間・深夜の遅延実行は前日扱い）
        id: date
        run: |
          HOUR=$(TZ='Asia/Tokyo' date +%H)
          if [ "$HOUR" -lt 12 ]; then
            # 23:30予定の実行が深夜〜正午前にずれ込んだ場合は「前日」として扱う
            TARGET=$(TZ='Asia/Tokyo' date -d 'yesterday' +%Y-%m-%d)
          else
            TARGET=$(TZ='Asia/Tokyo' date +%Y-%m-%d)
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 本日分が処理済みかチェック（スケジュール実行のみ）
        id: check
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_MSG=$(git log -1 --pretty=%s)
            if echo "$LAST_MSG" | grep -q "自動更新: ${{ steps.date.outputs.date }}"; then
              echo "手動実行で既に ${{ steps.date.outputs.date }} 分は処理済みのためスキップします"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: NPBデータを取得・更新
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run.py --date ${{ steps.date.outputs.date }}
        continue-on-error: true  # NPBが失敗してもMLB側は試す

      - name: MLBデータを取得・更新
        if: steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_mlb.py --date ${{ steps.date.outputs.date }}
        continue-on-error: true

      - name: 変更をコミット&push
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "更新なし（データ変化なし）"
          else
            git commit -m "自動更新: ${{ steps.date.outputs.date }}"
            git push
          fi
