name: MLBデータ自動更新

on:
  schedule:
    # UTC 10:00 = 日本時間 19:00
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '対象日付（例: 2026-08-20 / 2026-08-17:2026-08-24 / 空欄なら自動計算）'
        required: false
        default: ''
      steps:
        description: '実行ステップ（games / highlights / datamart / all。スペース区切りで複数可）'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  update-mlb:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 一時停止スイッチの確認（スケジュール実行のみ）
        id: pause
        run: |
          PAUSED="${{ vars.AUTO_UPDATE_PAUSED }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$PAUSED" = "true" ]; then
            echo "AUTO_UPDATE_PAUSED=true のため、今回の自動実行はスキップします"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 対象日付を計算（米国東部時間の「完了済みの前日」を狙う）
        id: date
        if: steps.pause.outputs.skip != 'true'
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            TARGET="${{ inputs.date }}"
          else
            HOUR=$(TZ='Asia/Tokyo' date +%H)
            if [ "$HOUR" -lt 12 ]; then
              # 19:00予定の実行が深夜〜正午前までずれ込んだ場合は、さらに1日前を狙う
              TARGET=$(TZ='Asia/Tokyo' date -d '2 days ago' +%Y-%m-%d)
            else
              TARGET=$(TZ='Asia/Tokyo' date -d 'yesterday' +%Y-%m-%d)
            fi
          fi
          echo "date=$TARGET" >> "$GITHUB_OUTPUT"
          echo "対象日: $TARGET"

      - name: 重複実行チェック（スケジュール実行のみ）
        id: check
        if: steps.pause.outputs.skip != 'true'
        run: |
          SKIP=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            LAST_MSG=$(git log -1 --pretty=%s)
            if echo "$LAST_MSG" | grep -q "MLB自動更新: ${{ steps.date.outputs.date }}"; then
              echo "手動実行で既に ${{ steps.date.outputs.date }} 分は処理済みのためスキップします"
              SKIP=true
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: MLBデータを取得・更新
        if: steps.pause.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/run_mlb.py --date ${{ steps.date.outputs.date }} --steps ${{ inputs.steps || 'all' }}

      - name: 変更をコミット&push
        if: steps.pause.outputs.skip != 'true' && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "更新なし（データ変化なし）"
          else
            git commit -m "MLB自動更新: ${{ steps.date.outputs.date }} (steps: ${{ inputs.steps || 'all' }})"
            git push
          fi
